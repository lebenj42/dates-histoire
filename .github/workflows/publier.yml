name: Carrousel du jour

on:
  schedule:
    - cron: "0 5 * * *"    # 07h00 a Paris (heure d'ete)
    - cron: "0 6 * * *"    # 07h00 a Paris (heure d'hiver)
  workflow_dispatch:
    inputs:
      date:
        description: "Date a traiter (AAAA-MM-JJ), vide = aujourd'hui"
        required: false
      essai:
        description: "Mode essai : generer sans publier"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: carrousel
  cancel-in-progress: false

jobs:
  carrousel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generer le carrousel
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # facultatif
        run: python run.py generer ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}

      - name: Publier les images sur le depot (hebergement public)
        run: |
          git config user.name "carrousel-bot"
          git config user.email "actions@github.com"
          git add docs state
          git commit -m "Carrousel du $(date -u +%F)" || echo "rien a committer"
          git push
          sleep 25   # propagation du CDN raw.githubusercontent

      - name: Publier sur Instagram
        if: ${{ github.event.inputs.essai != 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python run.py publier \
            --base-url "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docs" \
            ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }} \
            ${{ github.event_name == 'schedule' && '--garde-heure 7' || '' }}

      - name: Enregistrer l'etat
        if: always()
        run: |
          git add state docs || true
          git commit -m "Etat apres publication" || echo "rien a committer"
          git push || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carrousel
          path: docs/*/
          retention-days: 14
